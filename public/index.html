<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Agreement & Authorization</title>
    <style>
        /* تصميم الخلفية والفونت */
        body {
            background-color: #0b0b0b; /* أسود فاحم */
            color: #d4af37; /* ذهبي غامق */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        /* الحاوية الرئيسية */
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #141414; /* أسود أفتح قليلاً */
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        /* قسم اللوجو الجديد */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333; /* خط فاصل */
        }
        .logo-container img {
            max-height: 100px; /* حجم اللوجو */
            width: auto;
        }
        h2 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 24px;
        }
        /* باقي الفورم */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #f3f3f3;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }
        /* Signature Pad */
        canvas {
            border: 1px solid #d4af37;
            background: #1f1f1f;
            border-radius: 5px;
            width: 100%;
            height: 160px;
            cursor: crosshair;
            margin-top: 5px;
        }
        .signature-actions {
            text-align: right;
            margin-top: 5px;
        }
        .btn-clear {
            background: transparent;
            border: 1px solid #888;
            color: #888;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .btn-clear:hover {
            background: #d4af37;
            color: #0b0b0b;
            border-color: #d4af37;
        }
        /* Submit Button */
        button[type="submit"] {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0b0b0b;
            border: none;
            padding: 18px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 30px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button[type="submit"]:hover {
            background: linear-gradient(135deg, #f3f3f3, #d4af37);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        /* Responsive */
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 10px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- مكان اللوجو الفخم الجديد -->
        <div class="logo-container">
            <img src="/logo-new.png" alt="Reach-Point Logo" id="companyLogo">
        </div>

        <h2>Customer Agreement & Authorization</h2>

        <form id="agreementForm">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required placeholder="Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="(123) 456-7890">
                </div>
                <div class="form-group">
                    <label>E-Mail *</label>
                    <input type="email" id="email" required placeholder="john.doe@example.com">
                </div>
            </div>

            <div class="form-group">
                <label>Billing Address *</label>
                <input type="text" id="billingAddress" required placeholder="123 Main St, City, State, Zip">
            </div>
            <div class="form-group">
                <label>Shipping Address *</label>
                <input type="text" id="shippingAddress" required placeholder="Same as Billing or different...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount ($) *</label>
                    <input type="number" id="amount" required placeholder="100">
                </div>
                <div class="form-group">
                    <label>Card Holder Name *</label>
                    <input type="text" id="cardholderName" required placeholder="John Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Credit Card Number *</label>
                    <input type="text" id="cardNumber" required placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Exp Date *</label>
                        <input type="text" id="cardExp" required placeholder="MM/YY" maxlength="5">
                    </div>
                    <div style="flex: 1;">
                        <label>CVV *</label>
                        <input type="text" id="cardCvv" required placeholder="XXX" maxlength="4">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Digital Signature *</label>
                <canvas id="signaturePad"></canvas>
                <div class="signature-actions">
                    <button type="button" class="btn-clear" id="clearBtn">Clear Signature</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Agent Name *</label>
                    <input type="text" id="agentName" required>
                </div>
                <div class="form-group">
                    <label>Closer Name *</label>
                    <input type="text" id="closerName" required>
                </div>
            </div>
            <div class="form-group">
                <label>Reference Number *</label>
                <input type="text" id="referenceNumber" required>
            </div>

            <button type="submit">Submit Agreement</button>
        </form>
    </div>

    <script>
        // Signature Pad
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            // Redraw signature after resize if needed, but simpler to just clear
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // Initial sizing

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = '#d4af37'; // لون القلم ذهبي
            ctx.lineWidth = 2;
            ctx.stroke();
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        // Touch Events (for mobile)
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2;
            ctx.stroke();
            e.preventDefault(); // منع التمرير أثناء التوقيع
        });
        canvas.addEventListener('touchend', () => isDrawing = false);

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Form Submission
        document.getElementById('agreementForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                billingAddress: document.getElementById('billingAddress').value,
                shippingAddress: document.getElementById('shippingAddress').value,
                amount: document.getElementById('amount').value,
                cardholderName: document.getElementById('cardholderName').value,
                cardNumber: document.getElementById('cardNumber').value,
                cardExp: document.getElementById('cardExp').value,
                cardCvv: document.getElementById('cardCvv').value,
                signature: canvas.toDataURL(), // Convert signature to base64 string
                agentName: document.getElementById('agentName').value,
                closerName: document.getElementById('closerName').value,
                referenceNumber: document.getElementById('referenceNumber').value
            };

            try {
                const response = await fetch('/api/submit-form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    alert('Agreement submitted successfully!');
                    document.getElementById('agreementForm').reset();
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                } else {
                    alert('Submission failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An unexpected error occurred.');
            }
        });
    </script>
</body>
</html>
