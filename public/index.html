<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYALS - Customer Agreement & Authorization</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); }
            100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: #080808;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 50% 10%, #1a160d 0%, #080808 70%);
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 30px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.8s ease-out forwards;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container img {
            max-height: 120px;
            width: auto;
            border-radius: 50%;
            border: 2px solid #d4af37;
            animation: pulseGlow 4s infinite;
        }

        .welcome-banner {
            text-align: center;
            margin-bottom: 25px;
            font-size: 15px;
            color: #ccc;
            letter-spacing: 1px;
            animation: fadeIn 1s ease-out forwards;
        }

        .welcome-banner span {
            color: #d4af37;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #f3f3f3;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 24px;
            font-weight: 700;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 15px 18px;
            background: #141414;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            border-color: #d4af37;
            outline: none;
            background: #1c1a14;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .checkbox-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #d4af37;
            background: #141414;
            padding: 6px 12px;
            border: 1px solid #333;
            border-radius: 6px;
        }

        .checkbox-container:hover {
            border-color: #d4af37;
        }

        .checkbox-container input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #d4af37;
            margin: 0;
        }

        canvas {
            border: 1px solid #444;
            background: #141414;
            border-radius: 8px;
            width: 100%;
            height: 180px;
            cursor: crosshair;
            margin-top: 5px;
        }

        canvas:hover {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .signature-actions {
            text-align: right;
            margin-top: 8px;
        }

        .btn-clear {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-clear:hover {
            background: #d4af37;
            color: #080808;
            border-color: #d4af37;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #d4af37, #9a7b20);
            color: #080808;
            border: none;
            padding: 18px;
            width: 100%;
            font-size: 18px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #f3f3f3, #d4af37);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
                margin: 15px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="/LOGO USA.jpg" alt="ROYALS Logo" id="companyLogo">
        </div>

        <div class="welcome-banner" id="welcomeBanner">
            Welcome to the <span>ROYALS</span> Secure Portal. Please complete your verification below.
        </div>

        <h2>Customer Agreement & Authorization</h2>

        <form id="agreementForm">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required placeholder="Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="(123) 456-7890">
                </div>
                <div class="form-group">
                    <label>E-Mail *</label>
                    <input type="email" id="email" required placeholder="john.doe@example.com">
                </div>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <label style="margin-bottom: 0;">Address *</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="sameAddress"> Same as Billing Address
                    </label>
                </div>
                <input type="text" id="shippingAddress" required placeholder="123 Main St, City, State, Zip">
            </div>

            <div class="form-group">
                <label>Billing Address *</label>
                <input type="text" id="billingAddress" required placeholder="123 Main St, City, State, Zip">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount ($) *</label>
                    <input type="number" id="amount" required placeholder="100">
                </div>
                <div class="form-group">
                    <label>Card Holder Name *</label>
                    <input type="text" id="cardholderName" required placeholder="John Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Credit Card Number *</label>
                    <input type="text" id="cardNumber" required placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
                </div>
                <div class="form-group" style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Exp Date *</label>
                        <input type="text" id="cardExp" required placeholder="MM/YY" maxlength="5">
                    </div>
                    <div style="flex: 1;">
                        <label>CVV *</label>
                        <input type="text" id="cardCvv" required placeholder="XXX" maxlength="4">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Digital Signature *</label>
                <canvas id="signaturePad"></canvas>
                <div class="signature-actions">
                    <button type="button" class="btn-clear" id="clearBtn">Clear Signature</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Agent Name *</label>
                    <input type="text" id="agentName" required>
                </div>
                <div class="form-group">
                    <label>Closer Name *</label>
                    <input type="text" id="closerName" required>
                </div>
            </div>
            <div class="form-group">
                <label>Reference Number *</label>
                <input type="text" id="referenceNumber" required>
            </div>

            <button type="submit">Submit Secure Agreement</button>
        </form>
    </div>

    <script>
        // Dynamic Personalization based on URL parameters (e.g. ?name=Yousef)
        const urlParams = new URLSearchParams(window.location.search);
        const guestName = urlParams.get('name');
        if (guestName) {
            document.getElementById('welcomeBanner').innerHTML = `Welcome back, <span style="color:#d4af37; text-transform:capitalize;">${guestName}</span>. Secure session initialized for <span>ROYALS</span>.`;
        }

        const sameAddressCheckbox = document.getElementById('sameAddress');
        const billingAddressInput = document.getElementById('billingAddress');
        const shippingAddressInput = document.getElementById('shippingAddress');

        sameAddressCheckbox.addEventListener('change', () => {
            if (sameAddressCheckbox.checked) {
                shippingAddressInput.value = billingAddressInput.value;
                shippingAddressInput.setAttribute('readonly', true);
                shippingAddressInput.style.opacity = '0.7';
            } else {
                shippingAddressInput.value = '';
                shippingAddressInput.removeAttribute('readonly');
                shippingAddressInput.style.opacity = '1';
            }
        });

        billingAddressInput.addEventListener('input', () => {
            if (sameAddressCheckbox.checked) {
                shippingAddressInput.value = billingAddressInput.value;
            }
        });

        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.stroke();
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.stroke();
            e.preventDefault();
        });
        canvas.addEventListener('touchend', () => isDrawing = false);

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('agreementForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Encrypting & Submitting...';
            submitBtn.style.opacity = '0.7';

            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                billingAddress: billingAddressInput.value,
                shippingAddress: shippingAddressInput.value,
                amount: document.getElementById('amount').value,
                cardholderName: document.getElementById('cardholderName').value,
                cardNumber: document.getElementById('cardNumber').value,
                cardExp: document.getElementById('cardExp').value,
                cardCvv: document.getElementById('cardCvv').value,
                signature: canvas.toDataURL(),
                agentName: document.getElementById('agentName').value,
                closerName: document.getElementById('closerName').value,
                referenceNumber: document.getElementById('referenceNumber').value
            };

            try {
                const response = await fetch('/api/submit-form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    alert('Agreement submitted successfully and verified!');
                    document.getElementById('agreementForm').reset();
                    sameAddressCheckbox.checked = false;
                    shippingAddressInput.removeAttribute('readonly');
                    shippingAddressInput.style.opacity = '1';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                } else {
                    alert('Submission failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An unexpected error occurred.');
            } finally {
                submitBtn.textContent = 'Submit Secure Agreement';
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
