<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYALS - Customer Agreement & Authorization</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            background: #141414;
            border: none;
            border-radius: 0;
            padding: 40px 60px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .logo-container img {
            max-height: 150px;
            width: auto;
            border-radius: 50%;
            border: 2px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
        }
        h2 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 28px;
        }
        .form-row {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #f3f3f3;
            font-weight: 600;
            font-size: 15px;
        }
        input {
            width: 100%;
            padding: 16px;
            background: #1f1f1f;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        .checkbox-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #d4af37;
            background: #1f1f1f;
            padding: 6px 12px;
            border: 1px solid #444;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .checkbox-container input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #d4af37;
            margin: 0;
            padding: 0;
        }
        canvas {
            border: 1px solid #d4af37;
            background: #1f1f1f;
            border-radius: 6px;
            width: 100%;
            height: 200px;
            cursor: crosshair;
            margin-top: 5px;
        }
        .signature-actions {
            text-align: right;
            margin-top: 8px;
        }
        .btn-clear {
            background: transparent;
            border: 1px solid #888;
            color: #888;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn-clear:hover {
            background: #d4af37;
            color: #0b0b0b;
            border-color: #d4af37;
        }
        button[type="submit"] {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0b0b0b;
            border: none;
            padding: 20px;
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 35px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        button[type="submit"]:hover {
            background: linear-gradient(135deg, #f3f3f3, #d4af37);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .form-row {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Uploaded Luxury ROYALS Logo -->
        <div class="logo-container">
            <img src="/LOGO USA.jpg" alt="ROYALS Logo" id="companyLogo">
        </div>

        <h2>Customer Agreement & Authorization</h2>

        <form id="agreementForm">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required placeholder="Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="(123) 456-7890">
                </div>
                <div class="form-group">
                    <label>E-Mail *</label>
                    <input type="email" id="email" required placeholder="john.doe@example.com">
                </div>
            </div>

            <!-- Address Field with Checkbox -->
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <label style="margin-bottom: 0;">Address *</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="sameAddress"> Same as Billing Address
                    </label>
                </div>
                <input type="text" id="shippingAddress" required placeholder="123 Main St, City, State, Zip">
            </div>

            <div class="form-group">
                <label>Billing Address *</label>
                <input type="text" id="billingAddress" required placeholder="123 Main St, City, State, Zip">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount ($) *</label>
                    <input type="number" id="amount" required placeholder="100">
                </div>
                <div class="form-group">
                    <label>Card Holder Name *</label>
                    <input type="text" id="cardholderName" required placeholder="John Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Credit Card Number *</label>
                    <input type="text" id="cardNumber" required placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
                </div>
                <div class="form-group" style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Exp Date *</label>
                        <input type="text" id="cardExp" required placeholder="MM/YY" maxlength="5">
                    </div>
                    <div style="flex: 1;">
                        <label>CVV *</label>
                        <input type="text" id="cardCvv" required placeholder="XXX" maxlength="4">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Digital Signature *</label>
                <canvas id="signaturePad"></canvas>
                <div class="signature-actions">
                    <button type="button" class="btn-clear" id="clearBtn">Clear Signature</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Agent Name *</label>
                    <input type="text" id="agentName" required>
                </div>
                <div class="form-group">
                    <label>Closer Name *</label>
                    <input type="text" id="closerName" required>
                </div>
            </div>
            <div class="form-group">
                <label>Reference Number *</label>
                <input type="text" id="referenceNumber" required>
            </div>

            <button type="submit">Submit Agreement</button>
        </form>
    </div>

    <script>
        const sameAddressCheckbox = document.getElementById('sameAddress');
        const billingAddressInput = document.getElementById('billingAddress');
        const shippingAddressInput = document.getElementById('shippingAddress');

        sameAddressCheckbox.addEventListener('change', () => {
            if (sameAddressCheckbox.checked) {
                shippingAddressInput.value = billingAddressInput.value;
                shippingAddressInput.setAttribute('readonly', true);
            } else {
                shippingAddressInput.value = '';
                shippingAddressInput.removeAttribute('readonly');
            }
        });

        billingAddressInput.addEventListener('input', () => {
            if (sameAddressCheckbox.checked) {
                shippingAddressInput.value = billingAddressInput.value;
            }
        });

        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2.5;
            ctx.stroke();
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            e.preventDefault();
        });
        canvas.addEventListener('touchend', () => isDrawing = false);

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('agreementForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                billingAddress: billingAddressInput.value,
                shippingAddress: shippingAddressInput.value,
                amount: document.getElementById('amount').value,
                cardholderName: document.getElementById('cardholderName').value,
                cardNumber: document.getElementById('cardNumber').value,
                cardExp: document.getElementById('cardExp').value,
                cardCvv: document.getElementById('cardCvv').value,
                signature: canvas.toDataURL(),
                agentName: document.getElementById('agentName').value,
                closerName: document.getElementById('closerName').value,
                referenceNumber: document.getElementById('referenceNumber').value
            };

            try {
                const response = await fetch('/api/submit-form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    alert('Agreement submitted successfully!');
                    document.getElementById('agreementForm').reset();
                    sameAddressCheckbox.checked = false;
                    shippingAddressInput.removeAttribute('readonly');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                } else {
                    alert('Submission failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An unexpected error occurred.');
            }
        });
    </script>
</body>
</html>
