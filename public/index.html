<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYALS - Customer Agreement & Authorization</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 50px rgba(212, 175, 55, 0.7); }
            100% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
        }

        /* Border Light Chase Animation */
        @keyframes borderChase {
            0% {
                border-color: rgba(212, 175, 55, 0.4);
                box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.15), 0 0 20px rgba(212, 175, 55, 0.3);
            }
            50% {
                border-color: #ffe875;
                box-shadow: inset 0 0 35px rgba(255, 232, 117, 0.5), 0 0 45px rgba(212, 175, 55, 0.7);
            }
            100% {
                border-color: rgba(212, 175, 55, 0.4);
                box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.15), 0 0 20px rgba(212, 175, 55, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: #0b0b0b;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            overflow-x: hidden;
            animation: fadeIn 0.6s ease-out forwards;
        }

        /* Cinematic Hero Landing Section */
        .hero-section {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 30%, #1a160d 0%, #0b0b0b 75%);
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .hero-logo {
            max-height: 240px; /* Much larger and prominent */
            width: auto;
            border-radius: 50%;
            border: 3px solid #d4af37;
            margin-bottom: 35px;
            animation: pulseGlow 4s infinite ease-in-out;
        }

        /* ROYALS single-line frame with chasing light effect */
        .royals-frame {
            display: inline-block;
            padding: 25px 65px; /* Larger padding for a bold look */
            border: 3px solid #d4af37;
            border-radius: 10px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            animation: borderChase 3s infinite ease-in-out;
            margin-bottom: 30px;
        }

        .royals-title {
            color: #d4af37;
            font-size: 56px; /* High-impact large typography */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin: 0;
            text-shadow: 0 3px 15px rgba(212, 175, 55, 0.5);
        }

        .scroll-down-hint {
            position: absolute;
            bottom: 40px;
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fadeIn 1.5s infinite alternate;
        }

        .scroll-down-hint span {
            display: block;
            font-size: 24px;
            color: #d4af37;
            margin-top: 8px;
        }

        /* Form Container Section with Scroll Motion Effect */
        .container {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            background: #141414;
            border-top: 2px solid #333;
            padding: 60px 80px;
            position: relative;
            z-index: 5;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.8);
        }

        .welcome-banner {
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        .welcome-banner span {
            color: #d4af37;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 28px;
        }

        .form-row {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #f3f3f3;
            font-weight: 600;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 16px;
            background: #1f1f1f;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
            transform: translateY(-2px);
            background: #252525;
        }

        .checkbox-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #d4af37;
            background: #1f1f1f;
            padding: 6px 12px;
            border: 1px solid #444;
            border-radius: 4px;
            margin-top: 8px;
        }

        .checkbox-container:hover {
            border-color: #d4af37;
            transform: scale(1.01);
        }

        .checkbox-container input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #d4af37;
            margin: 0;
            padding: 0;
        }

        canvas {
            border: 1px solid #d4af37;
            background: #1f1f1f;
            border-radius: 6px;
            width: 100%;
            height: 200px;
            cursor: crosshair;
            margin-top: 5px;
        }

        canvas:hover {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .signature-actions {
            text-align: right;
            margin-top: 8px;
        }

        .btn-clear {
            background: transparent;
            border: 1px solid #888;
            color: #888;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-clear:hover {
            background: #d4af37;
            color: #0b0b0b;
            border-color: #d4af37;
            transform: translateY(-1px);
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0b0b0b;
            border: none;
            padding: 20px;
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 35px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #f3f3f3, #d4af37);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .hero-logo {
                max-height: 160px;
            }
            .royals-title {
                font-size: 36px;
                letter-spacing: 6px;
            }
            .royals-frame {
                padding: 15px 30px;
            }
            .form-row {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Cinematic Hero Landing Section with Chasing Light Frame -->
    <div class="hero-section" id="heroSection">
        <img src="/CARLO BC-modified.jpg" alt="ROYALS Logo" class="hero-logo" id="heroLogo">
        <div class="royals-frame" id="heroFrame">
            <h1 class="royals-title">ROYALS</h1>
        </div>
        <div class="scroll-down-hint">
            Scroll down to begin agreement
            <span>↓</span>
        </div>
    </div>

    <!-- Main Agreement Form Section -->
    <div class="container">
        <div class="welcome-banner" id="welcomeBanner">
            Welcome to the <span>ROYALS</span> Secure Portal. Please complete your verification below.
        </div>

        <h2>Customer Agreement & Authorization</h2>

        <form id="agreementForm">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required placeholder="Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="(123) 456-7890">
                </div>
                <div class="form-group">
                    <label>E-Mail *</label>
                    <input type="email" id="email" required placeholder="john.doe@example.com">
                </div>
            </div>

            <!-- Address Field -->
            <div class="form-group" style="margin-top: 20px;">
                <label>Address *</label>
                <input type="text" id="shippingAddress" required placeholder="123 Main St, City, State, Zip">
            </div>

            <!-- Billing Address Field with Checkbox Below -->
            <div class="form-group">
                <label>Billing Address *</label>
                <input type="text" id="billingAddress" required placeholder="123 Main St, City, State, Zip">
                <div>
                    <label class="checkbox-container">
                        <input type="checkbox" id="sameAddress"> Same as Billing Address
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount ($) *</label>
                    <input type="number" id="amount" required placeholder="100">
                </div>
                <div class="form-group">
                    <label>Card Holder Name *</label>
                    <input type="text" id="cardholderName" required placeholder="John Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Credit Card Number *</label>
                    <input type="text" id="cardNumber" required placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
                </div>
                <div class="form-group" style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Exp Date *</label>
                        <input type="text" id="cardExp" required placeholder="MM/YY" maxlength="5">
                    </div>
                    <div style="flex: 1;">
                        <label>CVV *</label>
                        <input type="text" id="cardCvv" required placeholder="XXX" maxlength="4">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Digital Signature *</label>
                <canvas id="signaturePad"></canvas>
                <div class="signature-actions">
                    <button type="button" class="btn-clear" id="clearBtn">Clear Signature</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Agent Name *</label>
                    <input type="text" id="agentName" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Closer Name *</label>
                    <input type="text" id="closerName" required>
                </div>
            </div>
            <div class="form-group" style="margin-top: 20px;">
                <label>Reference Number *</label>
                <input type="text" id="referenceNumber" required>
            </div>

            <button type="submit">Submit Agreement</button>
        </form>
    </div>

    <script>
        // Smooth Scroll-Driven Hero Shrink and Fade Motion Effect
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const heroLogo = document.getElementById('heroLogo');
            const heroFrame = document.getElementById('heroFrame');

            if (scrollY <= window.innerHeight) {
                const progress = scrollY / window.innerHeight; // 0 to 1
                const scale = Math.max(0.35, 1 - progress * 0.65);
                const opacity = Math.max(0, 1 - progress * 1.3);

                heroLogo.style.transform = `scale(${scale})`;
                heroFrame.style.transform = `scale(${scale})`;
                heroLogo.style.opacity = opacity;
                heroFrame.style.opacity = opacity;
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const guestName = urlParams.get('name');
        if (guestName) {
            document.getElementById('welcomeBanner').innerHTML = `Welcome back, <span style="color:#d4af37; text-transform:capitalize;">${guestName}</span>. Secure session initialized for <span>ROYALS</span>.`;
        }

        const sameAddressCheckbox = document.getElementById('sameAddress');
        const billingAddressInput = document.getElementById('billingAddress');
        const shippingAddressInput = document.getElementById('shippingAddress');

        sameAddressCheckbox.addEventListener('change', () => {
            if (sameAddressCheckbox.checked) {
                shippingAddressInput.value = billingAddressInput.value;
                shippingAddressInput.setAttribute('readonly', true);
                shippingAddressInput.style.opacity = '0.7';
            } else {
                shippingAddressInput.value = '';
                shippingAddressInput.removeAttribute('readonly');
                shippingAddressInput.style.opacity = '1';
            }
        });

        billingAddressInput.addEventListener('input', () => {
            if (sameAddressCheckbox.checked) {
                shippingAddressInput.value = billingAddressInput.value;
            }
        });

        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.stroke();
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.stroke();
            e.preventDefault();
        });
        canvas.addEventListener('touchend', () => isDrawing = false);

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('agreementForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Encrypting & Submitting...';
            submitBtn.style.opacity = '0.7';

            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                billingAddress: billingAddressInput.value,
                shippingAddress: shippingAddressInput.value,
                amount: document.getElementById('amount').value,
                cardholderName: document.getElementById('cardholderName').value,
                cardNumber: document.getElementById('cardNumber').value,
                cardExp: document.getElementById('cardExp').value,
                cardCvv: document.getElementById('cardCvv').value,
                signature: canvas.toDataURL(),
                agentName: document.getElementById('agentName').value,
                closerName: document.getElementById('closerName').value,
                referenceNumber: document.getElementById('referenceNumber').value
            };

            try {
                const response = await fetch('/api/submit-form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    alert('Agreement submitted successfully!');
                    document.getElementById('agreementForm').reset();
                    sameAddressCheckbox.checked = false;
                    shippingAddressInput.removeAttribute('readonly');
                    shippingAddressInput.style.opacity = '1';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                } else {
                    alert('Submission failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An unexpected error occurred.');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
